name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: projetomnunes_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d projetomnunes_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_SECRET_KEY: ci-only-not-a-secret
      DJANGO_ALLOWED_HOSTS: testserver
      DB_NAME: projetomnunes_test
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      TEST_DATABASE: postgresql
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install locked dependencies
        run: python -m pip install --requirement requirements-dev.txt
      - name: Secret scan
        run: python scripts/check_secrets.py
      - name: Regulatory matrix completeness
        run: python scripts/check_regulatory_matrix.py
      - name: Regulated release approval gate
        if: startsWith(github.ref, 'refs/tags/')
        run: python scripts/check_regulatory_matrix.py --require-release-approval
      - name: Check formatting
        run: ruff format --check .
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy .
      - name: Django checks
        run: python manage.py check --database default
      - name: Migration drift
        run: python manage.py makemigrations --check --dry-run
      - name: Migration plan
        run: python manage.py migrate --plan
      - name: Tests and coverage
        run: python -m pytest --cov-fail-under=90
      - name: Production deployment checks
        env:
          DJANGO_SETTINGS_MODULE: config.settings.production
          DJANGO_SECURE_HSTS_SECONDS: "31536000"
          AUDIT_INTEGRITY_KEY: ci-audit-integrity-key-with-32-characters-minimum
          CACHE_URL: redis://127.0.0.1:6379/1
          DB_SSLROOTCERT: /tmp/ci-postgresql-ca.pem
        run: python manage.py check --deploy
