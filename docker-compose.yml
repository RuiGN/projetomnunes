services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: projetomnunes:latest
    container_name: projetomnunes-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-4131}:8000"
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      CACHE_URL: redis://redis:6379/1
    volumes:
      - media_volume:/app/media
      - private_media_volume:/app/private_media
      - static_volume:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -H 'X-Forwarded-Proto: https' http://127.0.0.1:8000/accounts/login/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  db:
    image: postgres:16-alpine
    container_name: projetomnunes-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-projetomnunes}
      POSTGRES_USER: ${DB_USER:-projetomnunes}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-projetomnunes}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-projetomnunes} -d ${DB_NAME:-projetomnunes}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: projetomnunes-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
  redis_data:
  media_volume:
  private_media_volume:
  static_volume:
