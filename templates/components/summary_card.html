<article class="summary-card {% if card.tone == 'info' %}tone-info{% elif card.tone == 'success' %}tone-success{% elif card.tone == 'warning' %}tone-warning{% elif card.tone == 'danger' %}tone-danger{% else %}tone-neutral{% endif %}" aria-labelledby="{{ card.id }}-title">
  <div class="summary-card-heading">
    <h2 id="{{ card.id }}-title">{{ card.title }}</h2>
    {% if card.description %}<p>{{ card.description }}</p>{% endif %}
  </div>
  <data value="{{ card.raw_value }}">{{ card.value }}</data>
  {% if card.trend_label %}
    <p class="summary-card-trend" aria-label="Tendência: {{ card.trend_label }}">
      <span aria-hidden="true">↗</span>
      <span>{{ card.trend_label }}</span>
    </p>
  {% endif %}
  {% if card.action %}
    <a class="summary-card-action" href="{{ card.action.url }}">{{ card.action.label }}</a>
  {% endif %}
</article>
