{% extends layout_template %}

{% block title %}Pré-visualização: {{ content.title }}{% endblock %}

{% block content %}
<div class="product-page editorial-preview" aria-labelledby="preview-title">
  <header class="product-page-header"><span class="text-primary-emphasis fw-semibold text-uppercase small mb-0">Pré-visualização responsiva · versão {{ version.version }}</span><h1 id="preview-title">{{ content.title }}</h1></header>
  <article class="product-table-card content-body" aria-label="Conteúdo pré-visualizado">{{ version.body|safe }}</article>
  <a class="btn btn-outline-secondary align-self-start" href="{% url 'content_editorial_detail' content_id=content.pk %}">Voltar ao editor</a>
</div>
{% endblock %}
