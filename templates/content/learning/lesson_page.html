{% extends layout_template %}

{% block title %}Aula: {{ lesson.title }}{% endblock %}

{% block content %}
<main style="max-width:1080px;margin:0 auto;display:grid;gap:24px;">
  <header>
    <span class="workspace-eyebrow">Curso: {{ course.title }}</span>
    <h1 class="page-title">{{ lesson.title }}</h1>
  </header>
  {% include "content/lesson_player.html" with player=player only %}
  <section class="card" style="padding:24px;display:grid;gap:12px;" aria-labelledby="complete-title">
    <h2 id="complete-title">Concluir aula</h2>
    <form method="post" action="{% url 'content_lesson_event' course.pk lesson.pk %}">
      {% csrf_token %}
      <input type="hidden" name="client_event_id" value="{{ request_id|default:'' }}">
      <input type="hidden" name="kind" value="complete">
      <input type="hidden" name="position_seconds" value="0">
      <input type="hidden" name="active_seconds" value="0">
      <input type="hidden" name="user_initiated" value="true">
      <button type="submit">Marcar como concluída</button>
    </form>
  </section>
</main>
{% endblock %}
