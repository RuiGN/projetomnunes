{% extends layout_template %}

{% block title %}{{ page_title }} | {{ active_clinic.name|default:"Clínica" }}{% endblock %}

{% block content %}
<div>
  <header>
    <a href="{% url 'exercise_catalog' %}" class="btn btn-outline-secondary">← Voltar ao catálogo</a>
    <h1 class="mb-0">{{ page_title }}</h1>
  </header>

  <div class="card">
    <form method="post">
      {% csrf_token %}
      <div>
        <label for="id_title">Título do exercício *</label>
        <input type="text" name="title" id="id_title" class="form-control" required value="{{ exercise.title|default:'' }}" placeholder="Ex.: Respiração e ancoragem">
      </div>

      <div>
        <div>
          <label for="id_approach">Abordagem</label>
          <input type="text" name="approach" id="id_approach" class="form-control" value="{{ exercise.approach|default:'Geral' }}" placeholder="Ex.: TCC, Mindfulness, ACT">
        </div>
        <div>
          <label for="id_estimated_minutes">Duração estimada (minutos)</label>
          <input type="number" name="estimated_minutes" id="id_estimated_minutes" class="form-control" min="1" max="120" value="{{ exercise.estimated_minutes|default:'10' }}">
        </div>
      </div>

      <div>
        <label for="id_instructions">Instruções detalhadas *</label>
        <textarea name="instructions" id="id_instructions" class="form-control" rows="6" required placeholder="Descreva os passos para o paciente realizar o exercício...">{{ exercise.instructions|default:'' }}</textarea>
      </div>

      <div>
        <div>
          <label for="id_response_format">Formato da resposta</label>
          <select name="response_format" id="id_response_format" class="form-control">
            {% for code, label in response_formats %}
              <option value="{{ code }}" {% if exercise.response_format == code %}selected{% endif %}>{{ label }}</option>
            {% endfor %}
          </select>
        </div>
        <div>
          <label for="id_status">Status de publicação</label>
          <select name="status" id="id_status" class="form-control">
            {% for code, label in statuses %}
              <option value="{{ code }}" {% if exercise.status == code %}selected{% endif %}>{{ label }}</option>
            {% endfor %}
          </select>
        </div>
      </div>

      <div>
        <label for="id_accessibility_notes">Notas de acessibilidade (opcional)</label>
        <input type="text" name="accessibility_notes" id="id_accessibility_notes" class="form-control" value="{{ exercise.accessibility_notes|default:'' }}" placeholder="Ex.: Leitura simples, pode ser feito sentado">
      </div>

      <div>
        <a href="{% url 'exercise_catalog' %}" class="btn btn-outline-secondary">Cancelar</a>
        <button type="submit" class="btn btn-primary">Salvar exercício</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
