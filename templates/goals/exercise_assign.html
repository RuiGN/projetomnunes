{% extends layout_template %}

{% block title %}{{ page_title }} | {{ active_clinic.name|default:"Clínica" }}{% endblock %}

{% block content %}
<div style="max-width: 640px; margin: 0 auto; display: grid; gap: 20px;">
  <header>
    <a href="{% url 'exercise_catalog' %}" class="calendar-nav-btn" style="display: inline-block; margin-bottom: 8px;">← Voltar ao catálogo</a>
    <h1 class="page-title" style="margin: 0;">Atribuir: {{ exercise.title }}</h1>
  </header>

  <div class="card" style="padding: 24px; border: 1px solid var(--color-border); border-radius: 16px; background: var(--color-surface);">
    <form method="post" style="display: grid; gap: 16px;">
      {% csrf_token %}
      <div>
        <label for="id_patient_profile_id" style="font-weight: 600; display: block; margin-bottom: 6px;">Paciente *</label>
        <select name="patient_profile_id" id="id_patient_profile_id" class="form-control" required>
          <option value="">-- Selecione o paciente --</option>
          {% for patient in patients %}
            <option value="{{ patient.pk }}">{{ patient.full_name }}</option>
          {% endfor %}
        </select>
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
        <div>
          <label for="id_frequency" style="font-weight: 600; display: block; margin-bottom: 6px;">Frequência</label>
          <input type="text" name="frequency" id="id_frequency" class="form-control" value="Pontual" placeholder="Ex.: Diária, Semanal, Pontual">
        </div>
        <div>
          <label for="id_due_date" style="font-weight: 600; display: block; margin-bottom: 6px;">Prazo de conclusão (opcional)</label>
          <input type="date" name="due_date" id="id_due_date" class="form-control">
        </div>
      </div>

      <div>
        <label for="id_notes" style="font-weight: 600; display: block; margin-bottom: 6px;">Observações para o paciente (opcional)</label>
        <textarea name="notes" id="id_notes" class="form-control" rows="3" placeholder="Orientações específicas para a realização deste exercício..."></textarea>
      </div>

      <div style="display: flex; justify-content: flex-end; gap: 12px; margin-top: 12px;">
        <a href="{% url 'exercise_catalog' %}" class="calendar-nav-btn">Cancelar</a>
        <button type="submit" class="primary-action">Confirmar atribuição</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
