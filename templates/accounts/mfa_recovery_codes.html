{% extends "accounts/auth_base.html" %}

{% block auth_content %}
<section class="product-auth-card card border-0 shadow-sm p-4 p-md-5" aria-labelledby="recovery-title">
  <div class="mb-4">
    <h1 id="recovery-title" class="h3 mb-2">{{ title }}</h1>
    <p class="text-body-secondary mb-0">{{ description }}</p>
  </div>
  <div class="alert alert-warning" role="note">
    Estes códigos são exibidos apenas agora. Guarde-os em um local seguro e não os compartilhe.
  </div>
  <ul class="list-group font-monospace mb-4" aria-label="Códigos de recuperação">
    {% for code in recovery_codes %}
      <li class="list-group-item text-center user-select-all">{{ code }}</li>
    {% endfor %}
  </ul>
  <a class="btn btn-primary w-100" href="{{ continue_url }}">Continuar</a>
</section>
{% endblock %}
