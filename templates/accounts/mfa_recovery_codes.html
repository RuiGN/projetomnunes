{% extends "layouts/base.html" %}

{% block workspace %}
<main id="main-content" class="auth-page" tabindex="-1">
  <section class="auth-card" aria-labelledby="recovery-title">
    <h1 id="recovery-title">Guarde seus códigos de recuperação</h1>
    <p>Estes códigos aparecem uma única vez. Guarde-os em local seguro.</p>
    <ul aria-label="Códigos de recuperação">
      {% for code in recovery_codes %}<li><code>{{ code }}</code></li>{% endfor %}
    </ul>
    <a class="primary-action" href="{{ continue_url }}">Continuar</a>
  </section>
</main>
{% endblock %}
