{% extends "accounts/auth_base.html" %}

{% block auth_content %}
<section class="product-auth-card card border-0 shadow-sm p-4 p-md-5" aria-labelledby="auth-message-title">
  <div class="text-center">
    <h1 id="auth-message-title" class="h3 mb-3">{{ title }}</h1>
    <p class="text-body-secondary" role="status">{{ message }}</p>
    <a class="btn btn-primary mt-2" href="{{ action_url }}">{{ action_label }}</a>
  </div>
</section>
{% endblock %}
